<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دورة النظام - الملكة أميرة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8A2BE2;
            --secondary: #FF1493;
            --accent: #00FFFF;
            --bg-dark: #0f0c1b;
            --card-bg: rgba(25, 20, 45, 0.85);
            --text-light: #F0F8FF;
            --gold: #FFD700;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 43, 226, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 20, 147, 0.15) 0%, transparent 40%);
            color: var(--text-light);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* شاشة البداية الملكية */
        #welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #120826 0%, #2b093f 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
            transition: opacity 0.8s ease;
        }

        .welcome-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid var(--accent);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            max-width: 600px;
            width: 100%;
            backdrop-filter: blur(10px);
            animation: float 3s ease-in-out infinite;
        }

        .welcome-card h1 {
            color: var(--gold);
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
        }

        .welcome-card h2 {
            color: var(--accent);
            font-size: 1.5rem;
            margin-bottom: 25px;
        }

        .welcome-card p {
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .start-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px var(--accent);
        }

        /* الهيدر الرئيسي */
        header {
            text-align: center;
            padding: 30px 20px;
            background: rgba(15, 12, 27, 0.9);
            border-bottom: 1px solid rgba(138, 43, 226, 0.3);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        header h1 {
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        header p {
            color: var(--accent);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        /* الأقسام العامة */
        .section-box {
            background: var(--card-bg);
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s;
        }

        .section-box:hover {
            border-color: var(--accent);
        }

        .section-title {
            color: var(--gold);
            font-size: 1.5rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* التعريف السهل */
        .definition-content {
            font-size: 1.2rem;
            line-height: 1.8;
            color: #E2E8F0;
        }

        /* الخريطة الذهنية / الانفوجرافيك التفاعلي */
            </div>

    <script>
        function closeWelcome() {
            const welcome = document.getElementById('welcome-screen');
            welcome.style.opacity = '0';
            setTimeout(() => {
                welcome.style.display = 'none';
            }, 800);
        }
    </script>
</body>
</html>
